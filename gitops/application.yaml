apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortlink
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KidPcongg/k8s-gitops-homelab.git
    targetRevision: main
    path: charts/shortlink
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true