apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink
  namespace: shortlink
spec:
  ingressClassName: traefik
  rules:
    - host: shortlink.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortlink
                port:
                  number: 80